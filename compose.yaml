x-memory: &memory
  build: .
  image: memory-mcp:local
  env_file: .env
  environment:
    MEMORY_DATABASE_URL: postgresql+psycopg://memory:memory@db:5432/memory
    MEMORY_HOST: 0.0.0.0
    MEMORY_PORT: 8765
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
      POSTGRES_DB: memory
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *memory
    command: ["memory", "migrate"]
    depends_on:
      db:
        condition: service_healthy

  server:
    <<: *memory
    command: ["memory", "serve"]
    ports:
      - "127.0.0.1:8765:8765"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    <<: *memory
    command: ["memory", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres:
